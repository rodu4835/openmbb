name: build

# Builds the single-file OpenMBB binary for Windows and Linux. Runs on any
# tag push (attaches binaries to a GitHub Release) or on manual dispatch.
# PyInstaller can't cross-compile, so each binary is built on its own runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create/attach releases on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: openmbb-windows-x64.exe
            bin: dist/openmbb.exe
          - os: ubuntu-22.04
            asset: openmbb-linux-x64
            bin: dist/openmbb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Linux GUI + build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Full test suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -q; \
          else python -m pytest -q; fi

      # G8: on a tag build, the tag must match openmbb.__version__ so the
      # installer/About/Apps-list version can't silently disagree with the release
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          ver=$(python -c "import openmbb; print(openmbb.__version__)")
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v$ver (openmbb.__version__)"; exit 1
          fi

      - name: Build single-file binary
        run: python packaging/build.py

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/openmbb --selftest
          xvfb-run -a ./dist/openmbb --smoketest

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\openmbb.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen --selftest failed ($($p.ExitCode))" }
          # G3: also exercise the frozen GUI/pyserial bundle on Windows
          $p2 = Start-Process -FilePath dist\openmbb.exe -ArgumentList '--smoketest' -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "frozen --smoketest failed ($($p2.ExitCode))" }

      # Installer wraps the already-verified portable exe: Start menu entry,
      # optional desktop icon, per-user (no admin), uninstaller.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found on runner" }
          $ver = python -c "import openmbb; print(openmbb.__version__)"
          & $iscc "/DAppVersion=$ver" "/DExeSrc=$PWD\dist\openmbb.exe" packaging\openmbb.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          if (-not (Test-Path packaging\Output\openmbb-setup-windows-x64.exe)) { throw "installer missing" }

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.bin }}" "out/${{ matrix.asset }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp packaging/Output/openmbb-setup-windows-x64.exe out/
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: out/*

  # One release job attaches both binaries — avoids the matrix jobs racing to
  # create the same release concurrently.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v7
        with:
          path: dist-all
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-all/*
