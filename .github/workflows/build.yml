name: build

# Builds the OpenMBB binaries: the portable single-file exe on Windows and
# Linux, plus - on Windows - the --onedir tree the installer ships (nothing
# self-extracts at launch, which is the biggest heuristic-antivirus trigger an
# unsigned PyInstaller build has). Runs on any tag push (attaches binaries and
# SHA256SUMS.txt to a GitHub Release) or on manual dispatch. PyInstaller can't
# cross-compile, so each binary is built on its own runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create/attach releases on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: openmbb-windows-x64.exe
            bin: dist/openmbb.exe
          - os: ubuntu-22.04
            asset: openmbb-linux-x64
            bin: dist/openmbb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Linux GUI + build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Full test suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -q; \
          else python -m pytest -q; fi

      # G8: on a tag build, the tag must match openmbb.__version__ so the
      # installer/About/Apps-list version can't silently disagree with the release
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          ver=$(python -c "import openmbb; print(openmbb.__version__)")
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v$ver (openmbb.__version__)"; exit 1
          fi

      - name: Build portable binary (onefile)
        run: python packaging/build.py --mode onefile

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/openmbb --selftest
          xvfb-run -a ./dist/openmbb --smoketest

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\openmbb.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen --selftest failed ($($p.ExitCode))" }
          # G3: also exercise the frozen GUI/pyserial bundle on Windows
          $p2 = Start-Process -FilePath dist\openmbb.exe -ArgumentList '--smoketest' -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "frozen --smoketest failed ($($p2.ExitCode))" }

      # The installer ships a --onedir tree, not the portable exe: openmbb.exe
      # beside _internal\, run in place, nothing extracted to %TEMP% at launch.
      # Built and verified exactly like the portable one before Inno wraps it.
      - name: Build installer tree (onedir, Windows)
        if: runner.os == 'Windows'
        run: python packaging/build.py --mode onedir

      - name: Verify installer tree + version resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tree = "dist\onedir\openmbb"
          if (-not (Test-Path "$tree\_internal")) { throw "$tree has no _internal\ - not a onedir tree" }
          $p = Start-Process -FilePath "$tree\openmbb.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "onedir --selftest failed ($($p.ExitCode))" }
          $p2 = Start-Process -FilePath "$tree\openmbb.exe" -ArgumentList '--smoketest' -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "onedir --smoketest failed ($($p2.ExitCode))" }
          # Both exes carry the version resource build.py generated from
          # openmbb.__version__. Blank Properties > Details is one of the things
          # heuristic AV scores, and a stale number there would be a lie.
          $ver = python -c "import openmbb; print(openmbb.__version__)"
          foreach ($exe in @("dist\openmbb.exe", "$tree\openmbb.exe")) {
            $vi = (Get-Item $exe).VersionInfo
            if ($vi.FileVersion -ne $ver -or $vi.ProductVersion -ne $ver) {
              throw "$exe version resource says '$($vi.FileVersion)' / '$($vi.ProductVersion)', expected $ver"
            }
            if ($vi.CompanyName -ne 'OpenMBB' -or -not $vi.FileDescription) {
              throw "$exe version resource lacks company/description"
            }
            Write-Host "$exe : $($vi.FileDescription) v$($vi.FileVersion)"
          }

      # Installer wraps the verified onedir tree: Start menu entry, optional
      # desktop icon, per-user (no admin), uninstaller.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found on runner" }
          $ver = python -c "import openmbb; print(openmbb.__version__)"
          & $iscc "/DAppVersion=$ver" "/DDistDir=$PWD\dist\onedir\openmbb" packaging\openmbb.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          if (-not (Test-Path packaging\Output\openmbb-setup-windows-x64.exe)) { throw "installer missing" }

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.bin }}" "out/${{ matrix.asset }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp packaging/Output/openmbb-setup-windows-x64.exe out/
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: out/*

  # One release job attaches both binaries — avoids the matrix jobs racing to
  # create the same release concurrently.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v7
        with:
          path: dist-all
          merge-multiple: true

      # SHA-256 of every artifact, in sha256sum's own format so a download can
      # be checked with `sha256sum --ignore-missing -c SHA256SUMS.txt` (or
      # certutil / Get-FileHash by eye). Redirection, not a pipe into tee: the
      # shell expands the glob before it opens the output file, so the sums file
      # cannot list itself, and sha256sum's own exit status fails the step. See
      # README, "Windows SmartScreen and antivirus".
      - name: Write SHA256SUMS.txt
        working-directory: dist-all
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-all/*
