[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmbb"
version = "0.12.0"
description = "Phase-gated serial console & diagnostics for Gen2 MBB-based Zero electric motorcycles (2013-2019: S/SR/DS/DSR/FX/FXS/FXE)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "sv-ttk>=2.6",   # Windows-11-native ttk theme (graceful fallback if absent)
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6", "pillow>=10"]  # pillow: icon regeneration only

[project.scripts]
openmbb = "openmbb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openmbb = ["assets/*.png", "assets/*.html", "assets/*.svg", "assets/*.json"]
