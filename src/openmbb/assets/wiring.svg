<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c30"/>
      <stop offset="0.55" stop-color="#1c1440"/>
      <stop offset="1" stop-color="#0a0f2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2350" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1320" height="900" fill="url(#bg)"/>
  <rect width="1320" height="900" fill="url(#grid)"/>

  <!-- ===== TITLE BLOCK ===== -->
  <text x="60" y="60" font-size="32" font-weight="700" fill="#22d3ee" letter-spacing="1">OPENMBB · DIAGNOSTIC CABLE WIRING</text>
  <text x="62" y="94" font-size="18" fill="#b9b2d8">FTDI TTL-232R-3V3  &#8594;  Zero OBD-II / J1962   ·   2017+ FX/FXS: data port under the seat</text>
  <rect x="1006" y="34" width="254" height="40" rx="10" fill="#170f38" stroke="#3a2d6e"/>
  <text x="1133" y="60" font-size="17" font-weight="700" fill="#5cffb1" text-anchor="middle">38400 · 8-N-1 · 3.3 V TTL</text>
  <line x1="60" y1="116" x2="1260" y2="116" stroke="#3a2d6e" stroke-width="1.5"/>

  <text x="60" y="152" font-size="20" font-weight="700" fill="#ff5fd2">1 · CONNECTIONS</text>
  <text x="470" y="150" font-size="14" fill="#9a93b8">arrowheads show signal (data) direction</text>

  <!-- ===== FTDI ADAPTER ===== -->
  <text x="225" y="196" font-size="18" font-weight="700" fill="#e8e6f0" text-anchor="middle">FTDI USB &#8594; TTL</text>
  <!-- USB-A plug -->
  <rect x="40" y="318" width="58" height="44" rx="4" fill="#2a2350" stroke="#8b7fd0" stroke-width="2"/>
  <rect x="52" y="330" width="34" height="8" fill="#6b62a8"/>
  <rect x="52" y="342" width="22" height="8" fill="#6b62a8"/>
  <text x="69" y="382" font-size="12" fill="#9a93b8" text-anchor="middle">USB-A</text>
  <path d="M98 340 H150" stroke="#8b7fd0" stroke-width="6" fill="none"/>
  <!-- body -->
  <rect x="150" y="210" width="150" height="260" rx="14" fill="#241a4d" stroke="#8b7fd0" stroke-width="2"/>
  <text x="225" y="236" font-size="13" fill="#9a93b8" text-anchor="middle">6-pin header</text>

  <!-- FTDI pins (right edge x=300) -->
  <circle cx="300" cy="262" r="8" fill="#c3c8dc" stroke="#0a0620"/>
  <text x="286" y="267" font-size="16" fill="#e8e6f0" text-anchor="end">1 · GND · Blk</text>
  <circle cx="300" cy="300" r="8" fill="#7a5a3a" stroke="#0a0620"/>
  <text x="286" y="305" font-size="15" fill="#7c7699" text-anchor="end">2 · CTS · Brn (n/c)</text>
  <circle cx="300" cy="338" r="8" fill="#ff5566" stroke="#0a0620"/>
  <text x="286" y="343" font-size="15" fill="#ff8fa3" text-anchor="end">3 · +5V · Red</text>
  <circle cx="300" cy="376" r="8" fill="#ff9a3c" stroke="#0a0620"/>
  <text x="286" y="381" font-size="16" fill="#e8e6f0" text-anchor="end">4 · TXD · Org</text>
  <circle cx="300" cy="414" r="8" fill="#ffe14d" stroke="#0a0620"/>
  <text x="286" y="419" font-size="16" fill="#e8e6f0" text-anchor="end">5 · RXD · Yel</text>
  <circle cx="300" cy="452" r="8" fill="#5cd6a0" stroke="#0a0620"/>
  <text x="286" y="457" font-size="15" fill="#7c7699" text-anchor="end">6 · RTS · Grn (n/c)</text>

  <!-- ===== WIRES ===== -->
  <!-- GND: pin1 (y262) -> terminal (y239) -->
  <path d="M300 262 H520 V239 H700" stroke="#c3c8dc" stroke-width="5" fill="none"/>
  <!-- +5V taped-off stub -->
  <path d="M300 338 H470" stroke="#ff5566" stroke-width="4" fill="none" stroke-dasharray="9 7"/>
  <line x1="470" y1="330" x2="482" y2="346" stroke="#ff8fa3" stroke-width="2"/>
  <line x1="482" y1="330" x2="470" y2="346" stroke="#ff8fa3" stroke-width="2"/>
  <text x="496" y="343" font-size="15" font-weight="700" fill="#ff8fa3">TAPED OFF — never connect (+5 V)</text>
  <!-- TXD: pin4 (y376) -> terminal (y370); FTDI -> bike, arrow RIGHT -->
  <path d="M300 376 H520 V370 H700" stroke="#ff9a3c" stroke-width="5" fill="none"/>
  <polygon points="486,362 508,370 486,378" fill="#ff9a3c"/>
  <!-- RXD: pin5 (y414) -> terminal (y414); bike -> FTDI, arrow LEFT -->
  <path d="M300 414 H700" stroke="#ffe14d" stroke-width="5" fill="none"/>
  <polygon points="514,406 492,414 514,422" fill="#ffe14d"/>

  <!-- ===== OBD PIN TERMINALS ===== -->
  <rect x="700" y="217" width="236" height="46" rx="9" fill="#201a3e" stroke="#c3c8dc" stroke-width="1.5"/>
  <text x="716" y="239" font-size="18" font-weight="700" fill="#e8e6f0">OBD PIN 5</text>
  <text x="716" y="257" font-size="14" fill="#b9b2d8">diagnostic ground (GND)</text>

  <rect x="700" y="348" width="236" height="44" rx="9" fill="#201a3e" stroke="#ff9a3c" stroke-width="1.5"/>
  <text x="716" y="369" font-size="18" font-weight="700" fill="#e8e6f0">OBD PIN 9</text>
  <text x="716" y="386" font-size="13" fill="#ffc99a">bike Rx  ·  FTDI TX &#8594;</text>

  <rect x="700" y="394" width="236" height="44" rx="9" fill="#201a3e" stroke="#ffe14d" stroke-width="1.5"/>
  <text x="716" y="415" font-size="18" font-weight="700" fill="#e8e6f0">OBD PIN 8</text>
  <text x="716" y="432" font-size="13" fill="#fff0a0">bike Tx  ·  &#8594; FTDI RX</text>

  <!-- ===== OBD PHYSICAL REFERENCE ===== -->
  <text x="1130" y="184" font-size="16" font-weight="700" fill="#e8e6f0" text-anchor="middle">OBD-II / J1962 — looking into the port</text>
  <rect x="1108" y="196" width="44" height="10" rx="2" fill="#17123a" stroke="#8b7fd0"/>
  <polygon points="990,206 1270,206 1254,322 1006,322" fill="#17123a" stroke="#8b7fd0" stroke-width="2"/>

  <!-- top row pins 1-8 -->
  <g font-size="12" text-anchor="middle" fill="#cfd3e0">
    <circle cx="1018" cy="246" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1018" y="250">1</text>
    <circle cx="1050" cy="246" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1050" y="250">2</text>
    <circle cx="1082" cy="246" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1082" y="250">3</text>
    <circle cx="1114" cy="246" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1114" y="250">4</text>
    <circle cx="1146" cy="246" r="10" fill="#123a2e" stroke="#5cffb1" stroke-width="2.5"/><text x="1146" y="250" fill="#c9ffe6">5</text>
    <circle cx="1178" cy="246" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1178" y="250">6</text>
    <circle cx="1210" cy="246" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1210" y="250">7</text>
    <circle cx="1242" cy="246" r="10" fill="#123a2e" stroke="#5cffb1" stroke-width="2.5"/><text x="1242" y="250" fill="#c9ffe6">8</text>
  </g>
  <!-- bottom row pins 9-16 -->
  <g font-size="12" text-anchor="middle" fill="#cfd3e0">
    <circle cx="1018" cy="294" r="10" fill="#123a2e" stroke="#5cffb1" stroke-width="2.5"/><text x="1018" y="298" fill="#c9ffe6">9</text>
    <circle cx="1050" cy="294" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1050" y="298">10</text>
    <circle cx="1082" cy="294" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1082" y="298">11</text>
    <circle cx="1114" cy="294" r="10" fill="#3a3410" stroke="#fff59d" stroke-width="2.5"/><text x="1114" y="298" fill="#fff6c2">12</text>
    <circle cx="1146" cy="294" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1146" y="298">13</text>
    <circle cx="1178" cy="294" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1178" y="298">14</text>
    <circle cx="1210" cy="294" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1210" y="298">15</text>
    <circle cx="1242" cy="294" r="10" fill="#2a2350" stroke="#6b62a8"/><text x="1242" y="298">16</text>
  </g>
  <!-- reference legend -->
  <circle cx="998" cy="352" r="8" fill="#123a2e" stroke="#5cffb1" stroke-width="2.5"/>
  <text x="1014" y="357" font-size="14" fill="#c9ffe6">used by this cable (5, 8, 9)</text>
  <circle cx="998" cy="378" r="8" fill="#3a3410" stroke="#fff59d" stroke-width="2.5"/>
  <text x="1014" y="383" font-size="14" fill="#fff6c2">pin 12 — wiring varies by model year</text>

  <!-- ===== NOTES PANEL ===== -->
  <rect x="60" y="505" width="1200" height="350" rx="16" fill="#170f38" stroke="#3a2d6e"/>
  <text x="84" y="546" font-size="20" font-weight="700" fill="#ff5fd2">NOTES &amp; SAFETY</text>
  <g font-size="17" fill="#e8e6f0">
    <circle cx="92" cy="582" r="5" fill="#22d3ee"/><text x="108" y="588">3.3 V TTL logic levels ONLY — never connect 5 V or 12 V to these lines.</text>
    <circle cx="92" cy="618" r="5" fill="#22d3ee"/><text x="108" y="624">FTDI Red (+5 V) lead is taped off — do NOT back-power the bus.</text>
    <circle cx="92" cy="654" r="5" fill="#22d3ee"/><text x="108" y="660">Serial: 38400 baud, 8-N-1, no flow control, newline CR-LF.</text>
    <circle cx="92" cy="690" r="5" fill="#22d3ee"/><text x="108" y="696">Orange (TXD) idles ~3.3 V vs Black (GND) — that is a valid idle-high.</text>
    <circle cx="92" cy="726" r="5" fill="#22d3ee"/><text x="108" y="732">Pin 12 wiring varies by model year; on 2017+ FX/FXS the port is under the seat.</text>
    <circle cx="92" cy="762" r="5" fill="#22d3ee"/><text x="108" y="768">Isolation-resistance readings are only valid OFF the charger.</text>
    <circle cx="92" cy="798" r="5" fill="#22d3ee"/><text x="108" y="804">Garbage at 38400 usually means TX/RX are swapped — stop and recheck the wiring.</text>
  </g>
</svg>
